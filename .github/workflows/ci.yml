name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # Keep PR checks unconditional; skip only presentation docs on main pushes.
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - "docs/literature/**/*.md"
      - "docs/meetings/**/*.md"
      - "docs/team/**/*.md"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint forecasting source and tests
        run: ruff check src/forecasting tests/test_forecasting_*.py

      - name: Verify imports
        run: python -c "from src.forecasting import experiment, integrity, model_artifacts"

      - name: Type-check forecasting source
        run: python -m mypy src/forecasting --explicit-package-bases --disable-error-code import-untyped

      - name: Run tests
        run: python -m pytest -q
