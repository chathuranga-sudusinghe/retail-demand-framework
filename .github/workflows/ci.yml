name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify imports
        run: python -c "from src.forecasting import experiment, integrity, model_artifacts"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint forecasting source and tests
        run: ruff check src/forecasting tests/test_forecasting_*.py

      - name: Type-check forecasting source
        run: python -m mypy src/forecasting --explicit-package-bases --disable-error-code import-untyped

      - name: Run tests
        run: python -m pytest -q
