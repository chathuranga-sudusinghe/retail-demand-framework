name: CI Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Full test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Python-relevant changes
        id: scope
        run: python3 .github/scripts/ci_scope.py >> "$GITHUB_OUTPUT"

      - name: Skip Python checks for documentation/report-only changes
        if: steps.scope.outputs.run_python == 'false'
        run: echo "No Python inputs changed; full test suite skipped."

      - name: Set up Python 3.12
        if: steps.scope.outputs.run_python != 'false'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        if: steps.scope.outputs.run_python != 'false'
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        if: steps.scope.outputs.run_python != 'false'
        run: python -m pytest -q
