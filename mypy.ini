[mypy]
# Resolve the existing src.* namespace packages from the repository root.
explicit_package_bases = True

# These exact modules import installed dependencies without type markers.
# Keep import-untyped enabled everywhere else.
[mypy-src.data.validated_handoff]
# pyarrow, pyarrow.parquet
disable_error_code = import-untyped

[mypy-src.forecasting.models]
# threadpoolctl, catboost, sklearn.linear_model, sklearn.ensemble
disable_error_code = import-untyped

[mypy-src.forecasting.model_artifacts]
# joblib, threadpoolctl, catboost
disable_error_code = import-untyped

[mypy-src.forecasting.integrity]
# catboost
disable_error_code = import-untyped

[mypy-src.forecasting.model_ready]
# pyarrow, pyarrow.parquet
disable_error_code = import-untyped

[mypy-src.forecasting.orchestration]
# threadpoolctl
disable_error_code = import-untyped
